name: Validacao automatizada
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes com cobertura
        run: >-
          python -m pytest -v --junitxml=test-results.xml
          --cov --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo '## Cobertura (app/)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publicar evidencia de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-junit
          path: test-results.xml
      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            coverage.xml
            htmlcov/
